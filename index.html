<!DOCTYPE html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Madwolf Studios — independent developer building apps, games and software from idea to reality. Projects: Stusys and No Respawn in War." />
    <meta name="theme-color" content="#1A1C1E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Madwolf Studios — Independent Software &amp; Game Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('madwolf-theme')
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'night')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'night')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
